<section class="logo-container">
  <div class="windows-logo">
    <button
      class="window-pane red"
      type="button"
      aria-label="Passer le fond en rouge"
      (click)="selectColor('background-red')"
    ></button>
    <button
      class="window-pane green"
      type="button"
      aria-label="Passer le fond en vert"
      (click)="selectColor('background-green')"
    ></button>
    <button
      class="window-pane blue"
      type="button"
      aria-label="Passer le fond en bleu"
      (click)="selectColor('background-blue')"
    ></button>
    <button
      class="window-pane yellow"
      type="button"
      aria-label="Passer le fond en jaune"
      (click)="selectColor('background-yellow')"
    ></button>
  </div>
</section>
